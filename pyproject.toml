[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "SonicPerformance"
version = "1.3.1"
authors = [
  { name="AobanZ"},
]
description = "A light and fast AI-model library for general usage."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/AobanZ-MinecraftYoutuber/PySonic"
Issues = "https://github.com/AobanZ-MinecraftYoutuber/PySonic/issues"
Changelog = "https://github.com/AobanZu/PySonic/blob/main/changelog.txt"